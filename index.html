<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الاختبار القبلي - سنة أولى جامعة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --green:#0e4a34; --green-2:#176046; --tint:#eaf1ec; --tint-2:#f3f7f4;
  --gold:#b58a2c; --gold-d:#8d6a1b;
  --paper:#fbfbf8; --ink:#14251d; --muted:#5f6b64; --line:#d8ddd5; --danger:#a63a32;
}
*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Tajawal',system-ui,sans-serif;line-height:1.8;}
button,input,select{font-family:inherit;font-size:1rem;color:inherit;}

/* ---------- الشريط العلوي: اللوجوهان على الطرفين ---------- */
.bar{background:#fff;border-bottom:3px solid var(--green);}
.bar-in{max-width:900px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px;}
.bar img{width:72px;height:72px;display:block;flex:none;border-radius:50%;}
.bar-name{text-align:center;font-weight:700;font-size:.95rem;color:var(--green);line-height:1.6;}
.bar-name small{display:block;font-weight:500;font-size:.8rem;color:var(--muted);}

/* ---------- العنوان ---------- */
.hero{background:var(--tint) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='72' height='72' viewBox='0 0 72 72'><g fill='none' stroke='%230e4a34' stroke-opacity='.09' stroke-width='1'><path d='M36 6l8.5 15.5L60 18l-3.5 17.5L72 36l-15.5 4.5L60 54l-15.5-3.5L36 66l-8.5-15.5L12 54l3.5-13.5L0 36l15.5-.5L12 18l15.5 3.5z'/></g></svg>");
  border-bottom:1px solid var(--line);padding:44px 20px 36px;text-align:center;}
.hero h1{font-family:'Amiri',serif;font-weight:700;color:var(--green);font-size:2.6rem;line-height:1.55;margin:0 auto;max-width:15em;text-wrap:balance;}
.hero .tag{margin:8px 0 0;font-size:1.15rem;font-weight:700;color:var(--gold-d);}
.kind{display:flex;align-items:center;gap:14px;max-width:340px;margin:26px auto 0;color:var(--green);font-weight:800;font-size:1rem;}
.kind::before,.kind::after{content:"";flex:1;height:1px;background:var(--gold);}
.started .hero{display:none;}
.started .bar img{width:46px;height:46px;}
.started .bar-in{padding:8px 16px;}
.started .bar-name small{display:none;}

/* ---------- المحتوى ---------- */
.wrap{max-width:640px;margin:0 auto;padding:0 20px 56px;}
h2{font-family:'Amiri',serif;color:var(--green);font-size:1.7rem;line-height:1.5;margin:30px 0 4px;}
.lead{margin:0 0 22px;color:var(--muted);}
.field{margin-bottom:18px;}
.field label{display:block;font-weight:700;margin-bottom:6px;font-size:.95rem;}
.field input,.field select{width:100%;height:50px;padding:0 14px;border:1px solid #bfc7bd;border-radius:8px;background:#fff;}
.field input::placeholder{color:#97a19a;}
.field input:focus,.field select:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px rgba(14,74,52,.15);}
.err{color:var(--danger);font-weight:700;font-size:.92rem;min-height:1.5em;margin-bottom:8px;}
.btn{display:block;width:100%;height:52px;border:0;border-radius:8px;background:var(--green);color:#fff;font-weight:800;cursor:pointer;transition:background .15s;}
.btn:hover{background:var(--green-2);}
.btn:disabled{opacity:.6;cursor:wait;}
.btn.ghost{background:#fff;color:var(--green);border:1px solid var(--green);}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;}

/* التقدم — يثبت أعلى الشاشة */
.progress-wrap{position:sticky;top:0;z-index:5;background:var(--paper);padding:14px 0 12px;}
.progress-top{display:flex;justify-content:space-between;font-weight:700;color:var(--muted);font-size:.9rem;margin-bottom:6px;}
.progress{height:6px;background:#e1e6df;border-radius:3px;overflow:hidden;}
.progress i{display:block;height:100%;width:0;background:var(--green);transition:width .3s;}

/* السؤال */
.qrow{display:flex;gap:16px;align-items:flex-start;margin:14px 0 20px;}
.qn{font-family:'Amiri',serif;font-weight:700;font-size:2.6rem;line-height:1.05;color:var(--gold);flex:none;min-width:2.1rem;text-align:center;padding-left:16px;border-left:1px solid var(--line);}
.qtext{font-family:'Amiri',serif;font-weight:700;font-size:1.45rem;line-height:1.85;margin:0;color:var(--ink);}
.opts{display:grid;gap:10px;}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:right;padding:13px 16px;background:#fff;border:1px solid var(--line);border-radius:10px;cursor:pointer;line-height:1.75;font-weight:500;transition:background .12s,border-color .12s;}
.opt:hover{background:var(--tint-2);border-color:#b5c1b8;}
.opt .letter{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;border:1px solid #b5c1b8;font-weight:700;color:var(--green);background:#fff;}
.opt .otxt{flex:1;min-width:0;overflow-wrap:anywhere;}
.opt.selected{background:var(--tint);border-color:var(--green);box-shadow:inset -4px 0 0 var(--green);font-weight:700;}
.opt.selected .letter{background:var(--green);border-color:var(--green);color:#fff;}
.nav{margin-top:20px;}

/* النتيجة */
.score{margin:26px 0 8px;font-family:'Amiri',serif;font-weight:700;color:var(--green);display:flex;align-items:baseline;gap:12px;}
.score b{font-size:4.2rem;line-height:1;}
.score span{font-size:1.4rem;color:var(--muted);font-weight:400;}
.meter{height:10px;background:#e1e6df;border-radius:5px;overflow:hidden;margin-bottom:6px;}
.meter i{display:block;height:100%;background:var(--gold);border-radius:5px;}
.pct{color:var(--muted);font-weight:700;margin-bottom:22px;}
.status{font-weight:700;min-height:1.7em;margin-bottom:10px;}
.status.ok{color:var(--green-2);} .status.bad{color:var(--danger);} .status.wait{color:var(--muted);}
.thanks{color:var(--muted);margin:14px 0 0;}

@media(max-width:640px){
  .bar img{width:60px;height:60px;}
  .bar-name{font-size:.85rem;}
  .hero{padding:32px 18px 28px;}
  .hero h1{font-size:2rem;}
  .hero .tag{font-size:1rem;}
  .qn{font-size:2.1rem;min-width:1.7rem;padding-left:12px;}
  .qtext{font-size:1.25rem;}
  .score b{font-size:3.4rem;}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;}}


/* ===== إعادة تصميم احترافية: زمردي أزهري + ذهبي + عاجي ===== */
:root{
 --green:#063f2d; --green-2:#0b5a40; --tint:#f4f0df; --tint-2:#fbf8ed;
 --gold:#c49a3a; --gold-d:#89641a; --paper:#fffdf5; --ink:#123326; --muted:#68776d; --line:#e2d5ad; --danger:#a8322b;
}
body{background:radial-gradient(ellipse at top,#f7f1d9 0%,#fffdf6 42%,#f5f0df 100%);}
.bar{background:rgba(255,253,245,.96);border-bottom:4px solid var(--gold);box-shadow:0 5px 24px rgba(6,63,45,.08);position:relative;}
.bar::after{content:"";display:block;height:5px;background:linear-gradient(90deg,var(--green),#c8a44e,var(--green));opacity:.9;}
.bar-in{max-width:980px;padding:15px 22px;gap:20px;}
.bar img{width:82px;height:82px;object-fit:contain;background:#fffdf6;border:2px solid #d5b765;border-radius:50%;padding:3px;box-shadow:0 3px 12px #063f2d16;}
.bar-name{font-size:1.02rem;letter-spacing:.1px;}
.hero{position:relative;overflow:hidden;padding:46px 20px 40px;background:linear-gradient(135deg,#fffdf4 0%,#f4edcf 55%,#fffdf5 100%);border-bottom:1px solid #d7bd73;}
.hero::before,.hero::after{content:"✦";position:absolute;top:22px;color:#c49a3a;opacity:.45;font-size:2.4rem;}
.hero::before{right:max(5%,calc((100% - 900px)/2));}.hero::after{left:max(5%,calc((100% - 900px)/2));}
.hero h1{font-size:clamp(2rem,5vw,3.25rem);line-height:1.42;max-width:18em;text-shadow:0 1px 0 #fff;}
.hero .tag{font-size:clamp(1rem,2.3vw,1.25rem);margin-top:12px;color:#8b671d;}
.kind{background:var(--green);color:#fff;padding:8px 24px;border:2px solid var(--gold);border-radius:999px;box-shadow:0 5px 0 #c49a3a26;max-width:280px;justify-content:center;margin-top:24px;}
.kind::before,.kind::after{display:none;}
.wrap{max-width:720px;padding:0 22px 64px;}
#stage{position:relative;margin:26px 0 0;padding:clamp(22px,4vw,38px);background:rgba(255,254,248,.96);border:1px solid #d7bd73;border-radius:22px;box-shadow:0 14px 38px rgba(6,63,45,.09);}
#stage::before{content:"";position:absolute;inset:7px;border:1px solid rgba(196,154,58,.34);border-radius:16px;pointer-events:none;}
#stage>*{position:relative;}
#stage h2{font-size:clamp(1.6rem,4vw,2.05rem);margin:0 0 8px;padding-bottom:12px;border-bottom:1px solid #e5d8b2;}
.lead{margin-bottom:26px;}
.field{margin-bottom:20px;}
.field label{color:#194b37;font-size:1rem;margin-bottom:8px;}
.field input,.field select{height:54px;border:1px solid #d8c58b;border-radius:12px;background:#fffef9;padding:0 16px;transition:border-color .2s,box-shadow .2s;}
.field input:focus,.field select:focus{border-color:var(--gold);box-shadow:0 0 0 4px #c49a3a24;}
.btn{height:auto;min-height:54px;padding:13px 22px;border:1px solid #d7b45c;border-radius:13px;background:linear-gradient(135deg,#06452f,#0b6444);box-shadow:0 5px 0 #063c2b19;color:#fff;font-size:1.05rem;transition:transform .18s,box-shadow .18s,filter .18s;}
.btn:hover{background:linear-gradient(135deg,#0b5a40,#11764f);transform:translateY(-1px);box-shadow:0 7px 14px #063f2d22;}
.btn:active{transform:translateY(0);}.btn.ghost{background:#fffdf5;border:1px solid var(--gold);color:var(--green);}
.progress-wrap{top:0;margin:0 -22px;padding:14px 22px 16px;background:rgba(255,253,245,.96);border-bottom:1px solid #e2d5ad;backdrop-filter:blur(10px);}
.progress-top{color:var(--green);}.progress{height:9px;background:#e8e0c6;border-radius:99px;}.progress i{background:linear-gradient(90deg,#0b5a40,#c49a3a);border-radius:99px;}
.qrow{gap:17px;margin:8px 0 24px;}.qn{min-width:48px;height:48px;padding:0;border:0;border-radius:50%;display:grid;place-items:center;background:var(--green);color:#f5d987;font-size:1.8rem;box-shadow:0 0 0 4px #c49a3a2b;}
.qtext{font-size:clamp(1.25rem,3.2vw,1.6rem);line-height:1.75;}
.opts{gap:12px;}.opt{position:relative;padding:15px 17px;background:#fffef9;border:1px solid #e3d8b8;border-radius:14px;min-height:65px;box-shadow:0 2px 8px rgba(6,63,45,.025);}
.opt:hover{background:#fbf7e8;border-color:#c7a24b;transform:translateX(-2px);}
.opt .letter{width:36px;height:36px;background:#f5efd9;border-color:#d7bd73;color:var(--green);}
.opt.selected{background:#edf4ed;border-color:var(--green);box-shadow:inset -5px 0 0 var(--gold),0 4px 12px rgba(6,63,45,.07);}
.opt.selected .letter{background:var(--green);border-color:var(--gold);color:#fff2c1;}
.nav{margin-top:24px;}
.score{padding:20px 0 6px;}.score b{color:var(--green);}.meter{height:12px;background:#e9e0c6;}.meter i{background:linear-gradient(90deg,var(--green),var(--gold));}
.status{padding:12px 14px;border-radius:12px;overflow-wrap:anywhere;}.status.ok{background:#eaf4e9;border:1px solid #bad4bc;}.status.bad{background:#fff0ed;border:1px solid #e8bcb6;color:#8c241e;}.status.wait{background:#f7f1df;border:1px solid #e3d4a8;}
#retryBox .btn{margin-top:8px;}
@media(max-width:640px){
 .bar-in{padding:11px 12px;gap:9px;}.bar img{width:59px;height:59px;padding:2px;}.bar-name{font-size:.78rem;line-height:1.5;}
 .hero{padding:35px 16px 30px;}.hero::before,.hero::after{font-size:1.5rem;top:10px;}.hero h1{font-size:1.95rem;}
 .wrap{padding:0 12px 42px;}#stage{padding:24px 17px;margin-top:16px;border-radius:17px;}#stage::before{inset:5px;border-radius:12px;}
 .progress-wrap{margin:0 -12px;padding:12px;}.qrow{gap:12px;}.qn{min-width:39px;height:39px;font-size:1.5rem;}.opt{padding:12px;gap:10px;}
}


/* === لمسات حركية أنيقة مستوحاة من الأخضر الأزهري والذهبي === */
:root{--green:#073f2d;--green-2:#126347;--gold:#c49a3a;--gold-d:#87611b;--paper:#fffdf4;--tint:#f3eedc;--tint-2:#faf6e9;--line:#e3d3a8;}
body{background:radial-gradient(ellipse at 8% 8%,rgba(196,154,58,.12),transparent 32%),radial-gradient(ellipse at 92% 22%,rgba(7,63,45,.09),transparent 30%),var(--paper);}
.bar{background:rgba(255,253,244,.94);border-bottom:3px solid var(--gold);box-shadow:0 6px 24px rgba(7,63,45,.07);}
.bar img{filter:drop-shadow(0 3px 6px rgba(7,63,45,.12));transition:transform .35s ease;}
.bar img:hover{transform:rotate(-4deg) scale(1.06);}
.hero{position:relative;isolation:isolate;overflow:hidden;background:linear-gradient(135deg,#f7f1dd 0%,#fffdf4 48%,#e9f0e8 100%);border-bottom:1px solid #dfc98f;}
.hero:before,.hero:after{content:"✦";position:absolute;z-index:-1;color:rgba(196,154,58,.22);font-size:clamp(6rem,17vw,13rem);line-height:1;animation:ornamentFloat 7s ease-in-out infinite;pointer-events:none;}
.hero:before{left:3%;top:8%;}.hero:after{content:"❋";right:3%;bottom:0;animation-delay:-3s;}
.hero h1{animation:riseIn .85s cubic-bezier(.2,.8,.2,1) both;text-shadow:0 2px 0 rgba(196,154,58,.1);}
.hero .tag{animation:riseIn .9s .12s both;}
.kind{display:inline-flex;align-items:center;justify-content:center;margin-top:16px;padding:6px 24px;border:1px solid var(--gold);border-radius:999px;background:linear-gradient(120deg,var(--green),#0a5239);color:#fff4cf;box-shadow:0 5px 0 rgba(196,154,58,.22);animation:riseIn .9s .22s both;}
.wrap{animation:riseIn .7s .08s both;}
#stage,.card,.panel,.question,.register-card{border-color:rgba(196,154,58,.55);box-shadow:0 12px 35px rgba(7,63,45,.07);}
#stage{position:relative;overflow:hidden;background:rgba(255,255,250,.94);border-radius:24px;}
#stage:before{content:"";display:block;height:5px;background:linear-gradient(90deg,transparent,var(--gold),var(--green),var(--gold),transparent);}
button,.btn{transition:transform .2s ease,box-shadow .2s ease,filter .2s ease;}
button:hover,.btn:hover{transform:translateY(-2px);filter:saturate(1.12);box-shadow:0 8px 18px rgba(7,63,45,.15);}
button:active,.btn:active{transform:translateY(0) scale(.99);}
input,select{transition:border-color .2s,box-shadow .2s,background .2s;}
input:focus,select:focus{border-color:var(--gold)!important;box-shadow:0 0 0 4px rgba(196,154,58,.16)!important;outline:none;}
.option,.choice,label.option{transition:transform .18s ease,border-color .18s ease,background .18s ease;}
.option:hover,.choice:hover,label.option:hover{transform:translateX(-3px);border-color:var(--gold);background:#fff9e8;}
.progress i,.progress-fill,.meter i{background:linear-gradient(90deg,var(--green-2),var(--gold));}
.status.ok{border-inline-start:4px solid #27845b;background:#edf8f0;padding:12px;border-radius:12px;}
.status.bad{border-inline-start:4px solid #b23b32;background:#fff0ed;padding:12px;border-radius:12px;overflow-wrap:anywhere;}
@keyframes riseIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@keyframes ornamentFloat{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-12px) rotate(8deg)}}
@media(max-width:640px){.hero:before{left:-4%;top:4%;font-size:6rem}.hero:after{right:-3%;font-size:6rem}.bar img{filter:none}}
@media(prefers-reduced-motion:reduce){.hero h1,.hero .tag,.kind,.wrap,.hero:before,.hero:after{animation:none!important}button,.btn,.bar img{transition:none!important}}


/* ===== النسخة النهائية: Mobile-first + أسئلة ونتيجة احترافية ===== */
html,body{min-width:320px;overflow-x:hidden;}
body{padding-bottom:env(safe-area-inset-bottom);}
#stage{width:100%;}
.qrow{align-items:center;}
.opt{appearance:none;-webkit-appearance:none;position:relative;display:grid;grid-template-columns:40px minmax(0,1fr);align-items:center;min-height:68px;text-align:right;touch-action:manipulation;-webkit-tap-highlight-color:transparent;}
.opt .letter{width:38px;height:38px;font-size:1rem;transition:all .2s ease;}
.opt .otxt{line-height:1.8;}
.opt.selected{transform:translateY(-1px);}
.opt.selected::after{content:'✓';position:absolute;left:14px;top:50%;transform:translateY(-50%);width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--gold);color:#fff;font-size:.9rem;font-weight:800;box-shadow:0 3px 8px rgba(7,63,45,.18);}
.opt.selected .letter{transform:scale(1.05);}

/* نتيجة نهائية */
.result-card{position:relative;text-align:center;padding:10px 0 2px;}
.result-kicker{display:inline-flex;align-items:center;gap:8px;margin-bottom:8px;padding:6px 14px;border-radius:999px;background:#f6efda;border:1px solid #ddc47e;color:var(--gold-d);font-size:.9rem;font-weight:800;}
.result-title{font-family:'Amiri',serif!important;font-size:clamp(1.9rem,5vw,2.5rem)!important;color:var(--green)!important;margin:0 0 5px!important;border:0!important;padding:0!important;}
.result-subtitle{margin:0 auto 20px;color:var(--muted);font-size:1rem;max-width:520px;}
.result-main{display:grid;grid-template-columns:170px minmax(0,1fr);gap:22px;align-items:center;text-align:right;margin:8px 0 22px;padding:22px;border:1px solid #e0cf9d;border-radius:20px;background:linear-gradient(135deg,#fffdf7,#f7f2e1);}
.score-ring{--pct:0%;width:150px;height:150px;border-radius:50%;display:grid;place-items:center;margin:auto;background:conic-gradient(var(--green) var(--pct),#e8dfc6 0);position:relative;box-shadow:0 10px 24px rgba(7,63,45,.10);}
.score-ring::before{content:'';position:absolute;inset:10px;border-radius:50%;background:#fffdf7;border:1px solid #e4d7b7;}
.score-ring-inner{position:relative;z-index:1;text-align:center;line-height:1.15;}
.score-ring-inner b{display:block;font-family:'Amiri',serif;font-size:2.7rem;color:var(--green);}
.score-ring-inner span{display:block;color:var(--muted);font-size:.85rem;margin-top:3px;}
.result-meta{display:grid;gap:11px;}
.meta-row{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:10px 0;border-bottom:1px dashed #dccda8;}
.meta-row:last-child{border-bottom:0;}
.meta-row span{color:var(--muted);font-size:.9rem;}
.meta-row strong{color:var(--green);font-size:1rem;overflow-wrap:anywhere;}
.result-message{margin:0 0 16px;padding:15px 17px;border-radius:14px;background:#eef5ee;border:1px solid #c9dccb;color:#24543e;font-weight:700;line-height:1.8;}
.thanks{margin:0!important;color:var(--green)!important;font-family:'Amiri',serif;font-size:1.35rem;font-weight:700;}
.status{margin-top:18px!important;font-size:.92rem;}
.save-details{margin-top:8px;font-size:.78rem;line-height:1.6;direction:ltr;text-align:left;word-break:break-word;opacity:.8;}
#retryBox{display:grid;gap:8px;}
#retryBox .btn{margin-top:0;}

@media(max-width:640px){
  body{font-size:16px;}
  .bar-in{padding:9px 10px;gap:7px;}
  .bar img{width:52px;height:52px;}
  .bar-name{font-size:.72rem;line-height:1.45;flex:1;}
  .bar-name small{font-size:.68rem;}
  .hero{padding:28px 14px 24px;}
  .hero h1{font-size:1.7rem;line-height:1.55;}
  .hero .tag{font-size:.92rem;line-height:1.7;}
  .kind{font-size:.88rem;padding:6px 18px;}
  .wrap{padding:0 9px 34px;}
  #stage{padding:20px 13px;border-radius:16px;margin-top:12px;}
  #stage::before{inset:4px;border-radius:11px;}
  #stage h2{font-size:1.55rem;line-height:1.55;}
  .lead{font-size:.92rem;line-height:1.8;}
  .field input,.field select{height:52px;font-size:16px;}
  .btn{min-height:52px;font-size:1rem;padding:12px 15px;}
  .progress-wrap{margin:0 -9px;padding:10px 11px 12px;}
  .progress-top{font-size:.78rem;}
  .qrow{display:flex;flex-direction:column;align-items:stretch;gap:11px;margin:4px 0 17px;}
  .qn{width:42px;min-width:42px;height:42px;font-size:1.45rem;margin:0 auto;border-radius:50%;}
  .qtext{text-align:center;font-size:1.18rem;line-height:1.85;padding:0 3px;}
  .opts{gap:9px;}
  .opt{grid-template-columns:36px minmax(0,1fr);min-height:62px;padding:11px 10px;border-radius:12px;gap:9px;}
  .opt .letter{width:34px;height:34px;font-size:.92rem;}
  .opt .otxt{font-size:.93rem;line-height:1.75;}
  .opt.selected::after{left:9px;width:21px;height:21px;font-size:.78rem;}
  .nav{margin-top:18px;}
  .result-card{padding-top:2px;}
  .result-title{font-size:1.8rem!important;}
  .result-subtitle{font-size:.9rem;line-height:1.8;margin-bottom:15px;}
  .result-main{grid-template-columns:1fr;gap:17px;padding:17px 13px;border-radius:16px;margin-bottom:17px;}
  .score-ring{width:132px;height:132px;}
  .score-ring::before{inset:9px;}
  .score-ring-inner b{font-size:2.35rem;}
  .result-meta{text-align:right;width:100%;}
  .meta-row{padding:9px 2px;}
  .meta-row span,.meta-row strong{font-size:.88rem;}
  .result-message{font-size:.9rem;padding:12px 13px;}
  .thanks{font-size:1.2rem!important;line-height:1.7;}
}
@media(max-width:380px){
  .bar img{width:46px;height:46px;}
  .bar-name{font-size:.67rem;}
  .hero h1{font-size:1.52rem;}
  .qtext{font-size:1.1rem;}
  .opt .otxt{font-size:.88rem;}
}

.qrow,.qrow{display:flex;flex-direction:column;align-items:flex-start;gap:12px;margin:6px 0 22px;}
.qn,.qn{
  width:auto;min-width:0;height:auto;margin:0;
  display:inline-flex;align-items:center;gap:8px;
  padding:5px 16px 6px;border-radius:999px;
  background:var(--qn-bg);color:var(--qn);
  border:1px solid var(--qn-line);box-shadow:0 3px 10px rgba(6,63,45,.18);
  font-family:'Tajawal',system-ui,sans-serif;font-weight:800;font-size:.95rem;line-height:1.6;letter-spacing:.2px;
}
.qn::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--qn);flex:none;}
.qtext{text-align:right;width:100%;}
@media(max-width:640px){
  .qrow{align-items:stretch;gap:10px;margin:2px 0 16px;}
  .qn{align-self:flex-start;width:auto;min-width:0;height:auto;font-size:.85rem;padding:4px 14px 5px;margin:0;border-radius:999px;}
  .qtext{text-align:right;}
}

 { q:"ماذا أريد غير الشهادة الجامعية؟",
   opts:["الحصول على تقدير مرتفع فقط","النمو في الجوانب الروحية والمهنية والاجتماعية والصحية والاقتصادية","تكوين أكبر عدد من الصداقات","التخرج بأسرع وقت للالتحاق بوظيفة"], correct:1 },
 { q:"ما السلوك الأكثر فاعلية لضمان نجاح العمل الجماعي والحدّ من الاتكالية بين الزملاء؟",
   opts:["الصمت وتحمّل كافة المهام نيابةً عن الزملاء لتجنّب الخلافات.","إلقاء اللوم المستمر والانسحاب من العمل الجماعي بشكل كامل.","تحديد الأدوار والمسؤوليات بشفافية، ووضع آليات متابعة ومحاسبة عادلة وواضحة داخل الفريق.","التغاضي الدائم عن التقصير ومجاملة الأعضاء غير الملتزمين."], correct:2 }
];
/* ============================================== */

const COLLEGES = ["كلية الطب","كلية طب الأسنان","كلية الصيدلة","كلية الهندسة","كلية العلوم","كلية التجارة","كلية الدراسات الإسلامية والعربية","كلية الشريعة والقانون","كلية اللغة العربية","كلية أصول الدين","كلية الدراسات الإنسانية","كلية التمريض","كلية الطب البيطري","كلية الزراعة","كلية التربية","كلية اللغات والترجمة","أخرى"];

const $ = id => document.getElementById(id);
const stage = $('stage');
const TOTAL = questions.reduce((s,q)=>s+(q.pts||1),0);
const fa = n => Number(n).toLocaleString('ar-EG');
let current = 0, student = null, saving = false;
const answers = new Array(questions.length).fill(null);

$('logo1').src = CONFIG.LOGO_AZHAR;
$('logo2').src = CONFIG.LOGO_UNIT;

function el(tag, cls, text){ const e=document.createElement(tag); if(cls) e.className=cls; if(text!==undefined) e.textContent=text; return e; }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function escapeHtml(value){ return String(value ?? '').replace(/[&<>\"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[ch])); }
const toEnDigits = s => s.replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d));

/* ---------- 1) البيانات قبل الأسئلة ---------- */
function renderRegister(){
  $('progressWrap').style.display = 'none';
  stage.innerHTML = '';
  const box = el('div');
  box.innerHTML = `
    <h2>بيانات المشاركة</h2>
    <p class="lead">اكتبي بياناتكِ ثم ابدئي الاختبار، وعدد أسئلته ${fa(questions.length)} سؤالًا.</p>
    <div class="field"><label for="f_name">الاسم بالكامل</label><input id="f_name" type="text" autocomplete="name" maxlength="100" placeholder="الاسم ثلاثيًا أو رباعيًا"></div>
    <div class="field"><label for="f_college">الكلية</label>
      <select id="f_college"><option value="">اختاري الكلية</option>${COLLEGES.map(c=>`<option>${c}</option>`).join('')}</select></div>
    <div class="field" id="otherWrap" style="display:none"><label for="f_other">اسم الكلية</label><input id="f_other" type="text" maxlength="100" placeholder="اكتبي اسم الكلية"></div>
    <div class="field"><label for="f_phone">رقم التليفون (واتساب)</label><input id="f_phone" type="tel" inputmode="tel" autocomplete="tel" dir="ltr" style="text-align:right" maxlength="20" placeholder="01XXXXXXXXX"></div>
    <div class="err" id="regErr" role="alert"></div>
    <button class="btn" id="startBtn">ابدئي الاختبار</button>`;
  stage.appendChild(box);
  $('f_college').addEventListener('change', function(){ $('otherWrap').style.display = this.value === 'أخرى' ? '' : 'none'; });
  $('startBtn').addEventListener('click', () => {
    const v = id => $(id).value.trim();
    const name = v('f_name'), collegeSel = v('f_college'), other = v('f_other'), phone = toEnDigits(v('f_phone')).replace(/[\s\-+()]/g,'');
    const err = $('regErr');
    if (name.split(/\s+/).filter(Boolean).length < 2){ err.textContent = 'اكتبي الاسم ثلاثيًا أو رباعيًا.'; return; }
    if (!collegeSel || (collegeSel === 'أخرى' && !other)){ err.textContent = 'اختاري الكلية.'; return; }
    if (!/^\d{10,15}$/.test(phone)){ err.textContent = 'رقم التليفون غير صحيح، تأكدي من كتابته كاملًا.'; return; }
    student = { name, college: collegeSel === 'أخرى' ? other : collegeSel, phone };
    document.body.classList.add('started');
    $('progressWrap').style.display = '';
    renderQuestion();
  });
}

/* ---------- 2) الأسئلة ---------- */
function setProgress(){
  $('pcount').textContent = 'السؤال ' + fa(current+1) + ' من ' + fa(questions.length);
  $('ppct').textContent = fa(Math.round(current / questions.length * 100)) + '٪';
  $('progressFill').style.width = (current / questions.length * 100) + '%';
}

function renderQuestion(){
  setProgress();
  const item = questions[current];
  const letters = ['أ','ب','ج','د'];
  const mapped = item.opts.map((t,i)=>({t, idx:i}));
  const opts = item.fixed ? mapped : shuffle(mapped);
  /* نثبّت ارتفاع المنطقة على أطول سؤال ظهر، عشان الصفحة ما تقصرش وتطلع لفوق لوحدها */
  stage.style.minHeight = Math.max(parseFloat(stage.style.minHeight)||0, stage.offsetHeight) + 'px';
  stage.innerHTML = '';
  const qrow = el('div','qrow');
  qrow.append(el('span','qn','السؤال ' + fa(current+1)), el('p','qtext',item.q));
  const box = el('div','opts'); box.setAttribute('role','group');
  const err = el('div','err'); err.setAttribute('role','alert');
  const btns = [];
  opts.forEach((o, oi) => {
    const b = el('button','opt'); b.type = 'button'; b.setAttribute('aria-pressed','false');
    b.append(el('span','letter',letters[oi]), el('span','otxt',o.t));
    btns.push(b);
    b.addEventListener('click', () => {
      btns.forEach(x => { x.classList.remove('selected'); x.setAttribute('aria-pressed','false'); });
      b.classList.add('selected'); b.setAttribute('aria-pressed','true');
      answers[current] = o.idx;        // نخزّن الاختيار فقط — التصحيح في النهاية
      err.textContent = '';
    });
    box.appendChild(b);
  });
  const last = current === questions.length - 1;
  const next = el('button','btn nav', last ? 'إنهاء الاختبار' : 'التالي');
  next.addEventListener('click', () => {
    if (answers[current] === null){ err.textContent = 'اختاري إجابة قبل المتابعة.'; return; }
    next.disabled = true;
    current++;
    current < questions.length ? renderQuestion() : finish();   // بدون أي scroll
  });
  stage.append(qrow, box, err, next);
}

/* ---------- 3) التصحيح والحفظ ---------- */
function gradeAll(){ return questions.reduce((s,it,i) => s + (answers[i] === it.correct ? (it.pts||1) : 0), 0); }

async function saveToSupabase(row){
  const url = CONFIG.SUPABASE_URL.replace(/\/$/, '') + '/rest/v1/' + encodeURIComponent(CONFIG.SUPABASE_TABLE);
  const headers = {
    'Content-Type':'application/json',
    'apikey':CONFIG.SUPABASE_ANON_KEY,
    'Prefer':'return=minimal'
  };
  // sb_publishable_... is sent as apikey only. Legacy JWT anon keys additionally need Authorization.
  if (CONFIG.SUPABASE_ANON_KEY.startsWith('eyJ')) headers['Authorization'] = 'Bearer ' + CONFIG.SUPABASE_ANON_KEY;
  let res;
  try {
    res = await fetch(url, {method:'POST', headers, body:JSON.stringify(row)});
  } catch (e) {
    throw new Error('تعذر الاتصال بـ Supabase: ' + e.message);
  }
  if (!res.ok){
    let t=''; try{ t=await res.text(); }catch(_){}
    throw new Error('Supabase HTTP ' + res.status + (t ? ': ' + t : ''));
  }
}

function finish(){
  const score = gradeAll(), pct = Math.round(score/TOTAL*100);
  const record = { test_type:'pre', name:student.name, phone:student.phone, college:student.college,
                   score, total:TOTAL, percentage:pct, quiz_name:CONFIG.QUIZ_NAME };
  $('progressWrap').style.display = 'none';
  stage.style.minHeight = '';
  stage.innerHTML = `
    <div class="result-card">
      <div class="result-kicker">✦ الاختبار القبلي</div>
      <h2 class="result-title">نتيجتكِ النهائية</h2>
      <p class="result-subtitle">أحسنتِ إتمام الاختبار.</p>
      <div class="result-main">
        <div class="score-ring" style="--pct:${pct}%">
          <div class="score-ring-inner"><b>${fa(pct)}٪</b><span>نسبة الإجابة</span></div>
        </div>
        <div class="result-meta">
          <div class="meta-row"><span>الدرجة</span><strong>${fa(score)} من ${fa(TOTAL)}</strong></div>
          <div class="meta-row"><span>الاسم</span><strong>${escapeHtml(student.name)}</strong></div>
          <div class="meta-row"><span>الكلية</span><strong>${escapeHtml(student.college)}</strong></div>
        </div>
      </div>
      <p class="result-message">تم الانتهاء من الاختبار بنجاح.</p>
      <div class="status wait" id="status" role="status"></div>
      <div id="retryBox"></div>
    </div>`;
  window.scrollTo({top:0, behavior:'smooth'});   // مرة واحدة فقط لعرض النتيجة
  doSave(record);
}

async function doSave(record){
  if (saving) return; saving = true;
  const st = $('status'), box = $('retryBox'); box.innerHTML = '';
  st.className = 'status wait'; st.textContent = 'جارٍ تسجيل نتيجتكِ...';
  try{
    await saveToSupabase(record);
    st.className = 'status ok'; st.textContent = 'تم تسجيل بياناتكِ ونتيجتكِ.';
  }catch(e){
    console.error(e);
    st.className = 'status bad';
    const detail = (e && e.message) ? String(e.message).slice(0, 500) : 'خطأ غير معروف';
    st.textContent = 'تعذّر تسجيل النتيجة تلقائيًا. يمكنكِ إعادة المحاولة من الزر أدناه.';
    const b = el('button','btn ghost','إعادة المحاولة');
    b.addEventListener('click', () => { saving = false; doSave(record); });
    box.appendChild(b);
    const details = el('div','save-details');
    details.textContent = e.message || 'خطأ غير معروف';
    box.appendChild(details);
  }finally{ saving = false; }
}

renderRegister();
</script>
</body>
</html>
